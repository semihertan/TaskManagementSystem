<mat-toolbar class="app-toolbar" role="navigation" aria-label="Ana navigasyon">
  <span class="logo">
    <mat-icon aria-hidden="true">task_alt</mat-icon>
    Task Management
  </span>

  <span class="spacer"></span>

  <div class="nav-links">
    <button
      mat-button
      routerLink="/dashboard"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <mat-icon aria-hidden="true">dashboard</mat-icon>
      Dashboard
    </button>

    <button
      mat-button
      routerLink="/tasks"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
    >
      <mat-icon aria-hidden="true">assignment</mat-icon>
      Tasks
    </button>

    <button
      mat-button
      routerLink="/categories"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <mat-icon aria-hidden="true">folder</mat-icon>
      Categories
    </button>

    <button
      mat-button
      routerLink="/profile"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <mat-icon aria-hidden="true">account_circle</mat-icon>
      Profilim
    </button>

    <button mat-button type="button" class="logout-button" (click)="logout()">
      <mat-icon aria-hidden="true">logout</mat-icon>
      Çıkış Yap
    </button>

    <button
      mat-icon-button
      type="button"
      class="theme-toggle"
      [attr.aria-label]="
        themeService.currentTheme() === 'dark' ? 'Açık temaya geç' : 'Koyu temaya geç'
      "
      [attr.title]="themeService.currentTheme() === 'dark' ? 'Açık temaya geç' : 'Koyu temaya geç'"
      [attr.aria-pressed]="themeService.currentTheme() === 'dark'"
      (click)="toggleTheme()"
    >
      <mat-icon aria-hidden="true">
        {{ themeService.currentTheme() === 'dark' ? 'light_mode' : 'dark_mode' }}
      </mat-icon>
    </button>
  </div>

  <button
    mat-icon-button
    class="mobile-menu-btn"
    type="button"
    aria-label="Navigasyon menüsünü aç"
    [matMenuTriggerFor]="menu"
  >
    <mat-icon aria-hidden="true">menu</mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    <button
      mat-menu-item
      routerLink="/dashboard"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <mat-icon aria-hidden="true">dashboard</mat-icon>
      <span>Dashboard</span>
    </button>

    <button
      mat-menu-item
      routerLink="/tasks"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
    >
      <mat-icon aria-hidden="true">assignment</mat-icon>
      <span>Tasks</span>
    </button>

    <button
      mat-menu-item
      routerLink="/categories"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <mat-icon aria-hidden="true">folder</mat-icon>
      <span>Categories</span>
    </button>

    <button
      mat-menu-item
      routerLink="/profile"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <mat-icon aria-hidden="true">account_circle</mat-icon>
      <span>Profilim</span>
    </button>

    <button mat-menu-item type="button" class="logout-button" (click)="logout()">
      <mat-icon aria-hidden="true">logout</mat-icon>
      <span>Çıkış Yap</span>
    </button>

    <button
      mat-menu-item
      type="button"
      (click)="toggleTheme()"
      [attr.aria-label]="
        themeService.currentTheme() === 'dark' ? 'Açık temaya geç' : 'Koyu temaya geç'
      "
    >
      <mat-icon aria-hidden="true">
        {{ themeService.currentTheme() === 'dark' ? 'light_mode' : 'dark_mode' }}
      </mat-icon>

      <span>
        {{ themeService.currentTheme() === 'dark' ? 'Açık Tema' : 'Koyu Tema' }}
      </span>
    </button>
  </mat-menu>
</mat-toolbar>
